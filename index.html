<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шилжүүлэг</title>
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Шилжүүлэг">
<style>
  html, body { margin: 0; height: 100%; background: #f3f4f6; font-family: -apple-system, Roboto, Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #lock { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #15803d; color: #fff; text-align: center; padding: 24px; }
  #lock img { width: 96px; height: 96px; border-radius: 22px; }
  #lock h1 { font-size: 22px; margin: 4px 0 0; }
  #lock p { margin: 0; font-size: 15px; opacity: .9; max-width: 320px; }
  #lock button { font-size: 18px; font-weight: 700; padding: 14px 26px; border-radius: 14px; border: 0; background: #fff; color: #15803d; min-width: 240px; }
  #lock .ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); font-weight: 400; font-size: 15px; padding: 10px 18px; }
  #lockMsg { min-height: 20px; font-size: 14px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="lock">
  <img src="icon-192.png" alt="">
  <h1>Шилжүүлэг</h1>
  <p id="lockText">Царай таниулж нээнэ үү</p>
  <button id="unlockBtn" type="button">🙂 Face ID-аар нээх</button>
  <button id="setupBtn" class="hide" type="button">🙂 Face ID тохируулах</button>
  <button id="skipBtn" class="ghost hide" type="button">Дараа тохируулах</button>
  <div id="lockMsg"></div>
</div>
<script>
  const APP = 'https://script.google.com/macros/s/AKfycbzoU6fvFJL35QxthjZOu3HKL-W6sZMPt5rBQ6TsmyC8rn3YxmhQWmVVsoFWCA4x48YmXA/exec';
  const $ = (id) => document.getElementById(id);
  const ls = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  };
  const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));

  function openApp() {
    $('lock').style.display = 'none';
    if (!document.querySelector('iframe')) {
      const f = document.createElement('iframe');
      f.src = APP; f.title = 'Шилжүүлэг'; f.allow = 'camera; clipboard-write';
      document.body.appendChild(f);
    }
  }
  function showLock(mode) {
    $('lock').style.display = 'flex';
    $('unlockBtn').classList.toggle('hide', mode !== 'unlock');
    $('setupBtn').classList.toggle('hide', mode !== 'setup');
    $('skipBtn').classList.toggle('hide', mode !== 'setup');
    $('lockText').textContent = mode === 'setup'
      ? 'Дараагийн удаагаас апп-аа царай таниулж (Face ID) нээх үү?'
      : 'Царай таниулж нээнэ үү';
  }

  async function setup() {
    $('lockMsg').textContent = '';
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        rp: { name: 'Шилжүүлэг', id: location.hostname },
        user: { id: rand(16), name: 'shiljuuleg', displayName: 'Шилжүүлэг' },
        challenge: rand(32),
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000
      }});
      ls.set('fidCred', b64(cred.rawId));
      ls.set('fidSkip', '');
      openApp();
    } catch (e) {
      $('lockMsg').textContent = 'Тохируулж чадсангүй. Дахин оролдоно уу.';
    }
  }

  async function unlock() {
    $('lockMsg').textContent = '';
    try {
      await navigator.credentials.get({ publicKey: {
        challenge: rand(32),
        allowCredentials: [{ type: 'public-key', id: unb64(ls.get('fidCred')) }],
        userVerification: 'required',
        timeout: 60000
      }});
      openApp();
    } catch (e) {
      $('lockMsg').textContent = 'Таньж чадсангүй. Дахин оролдоно уу.';
    }
  }

  $('unlockBtn').onclick = unlock;
  $('setupBtn').onclick = setup;
  $('skipBtn').onclick = () => { ls.set('fidSkip', '1'); openApp(); };

  (async () => {
    let ok = false;
    try { ok = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) {}
    if (!ok) return openApp();
    if (ls.get('fidCred')) return showLock('unlock');
    if (ls.get('fidSkip')) return openApp();
    showLock('setup');
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
